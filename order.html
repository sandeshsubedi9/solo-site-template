<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Secure Store | Vivalis</title>
  <meta http-equiv="refresh" content="2;url=https://secureofficialsite.store/buy-vivalis">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --clr-primary: #0A5C36;
      --ff-head: 'Space Grotesk', sans-serif;
      --ff-body: 'DM Sans', sans-serif;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f4f9f6;
      font-family: var(--ff-body);
      color: #3a4a3f;
      text-align: center;
    }

    .loader-wrap {
      background: #fff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(10, 92, 54, 0.1);
      max-width: 400px;
      width: 90%;
    }

    .logo {
      font-family: var(--ff-head);
      font-size: 2rem;
      font-weight: 800;
      color: var(--clr-primary);
      margin-bottom: 24px;
    }

    .logo span {
      color: #E8A020;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(10, 92, 54, 0.1);
      border-top-color: var(--clr-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: var(--ff-head);
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: #6b7e72;
    }

    .btn-manual {
      display: inline-block;
      margin-top: 24px;
      color: var(--clr-primary);
      text-decoration: underline;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="loader-wrap">
    <div class="logo">Vivalis<span>.</span></div>
    <div class="spinner"></div>
    <h1>Secure Checkout</h1>
    <p>Redirecting you to our official secure checkout page...</p>
    <a href="https://secureofficialsite.store/buy-vivalis" class="btn-manual">Click here if you are not redirected</a>
  </div>

</body>
</html>
